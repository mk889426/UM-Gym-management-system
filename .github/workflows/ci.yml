name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install root dependencies (if any)
        run: npm install

      - name: Run full build (frontend + server)
        run: npm run build

      - name: Build success
        run: echo "Build completed successfully"